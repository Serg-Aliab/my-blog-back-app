plugins {
	id 'java'
	id 'war'
	id 'io.spring.dependency-management' version '1.1.7'
}

dependencyManagement {
	imports {
		mavenBom 'org.springframework:spring-framework-bom:6.2.8'
	}
}

group = 'ru.yandex.practicum'
version = '0.0.1-SNAPSHOT'
description = 'My Blog Back App'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

compileJava { options.compilerArgs += ['-parameters'] }

dependencies {
	implementation 'org.springframework:spring-webmvc'
	implementation 'org.springframework:spring-jdbc'
	implementation 'org.springframework:spring-orm'
	implementation 'org.springframework.data:spring-data-jpa:3.5.5'
	implementation 'jakarta.servlet:jakarta.servlet-api:6.1.0'
	implementation 'org.hibernate.orm:hibernate-core:7.1.7.Final'
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
	implementation 'com.fasterxml.jackson.core:jackson-core:2.17.0'
	implementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.0'
	implementation 'org.projectlombok:lombok:1.18.30'
	implementation 'com.h2database:h2:2.2.224'
	implementation 'org.xerial:sqlite-jdbc:3.41.2.2'
	implementation 'org.hibernate.orm:hibernate-community-dialects:7.1.7.Final'
	implementation 'javax.validation:validation-api:2.0.1.Final'
	implementation 'org.hibernate.validator:hibernate-validator:6.2.3.Final'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
	testImplementation 'org.springframework:spring-test'
	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.2'
	testImplementation 'org.hamcrest:hamcrest:2.2'
	testImplementation 'com.jayway.jsonpath:json-path:2.9.0'
}

tasks.named('test') {
	useJUnitPlatform()
}

def props = new Properties()
file("gradle.properties").withInputStream { props.load(it) }

tasks.register('myBuild', Copy) {
	dependsOn("build")
	from  'build/libs'
	include "*.war"
	into props.getProperty("tomcat.path") + '/' + props.getProperty("tomcat.deploy.folder")
}
